@media(max-width:600px){header{padding:0 10px;grid-template-columns:auto 1fr auto}.logo span{display:none}nav{justify-self:center}.wrap{padding:32px 12px}}

const CLOUD="pl9amsir",PRESET="brendanmedia",CDN=`https://res.cloudinary.com/${CLOUD}/image`;

let fs=null,auth=null,hraw=[];

async function shrink(f){try{const b=await createImageBitmap(f,{imageOrientation:"from-image"}),k=Math.min(1,3000/Math.max(b.width,b.height));
 if(k===1&&f.size<8e6)return f;const c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);

 const w=async()=>{while(i<N){const k=i++,f=files[k];try{const b=await shrink(f),fd=new FormData();fd.append("file",b);fd.append("upload_preset",PRESET);fd.append("public_id",dir+"/"+rid()+rid());
  const r=await fetch("https://api.cloudinary.com/v1_1/"+CLOUD+"/image/upload",{method:"POST",body:fd}),j=await r.json();if(!r.ok)throw new Error(j.error?.message||r.status);
  res[k]={id:rid(),pid:j.public_id,v:j.version,f:j.format,w:j.width,h:j.height}}catch(e){fail++;err=e.message}

 await Promise.all([w(),w(),w()]);const out=res.filter(Boolean);msg.textContent=`Done. ${out.length} uploaded`+(fail?`, ${fail} failed: ${err}`:".");return out}

 const m=$("#n-"+h);if(m)m.classList.add("on");
 ({home:rHome,gallery:rGallery,book:rHome,admin:rAdmin,"admin-home":rAHome,"admin-gal":rAGal})[h]?.();window.scrollTo(0,0)}

 app.innerHTML=`<section class="hero">${s.length?s.map((x,i)=>`<img src="${x.url}" class="${i?"":"on"}" alt="">`).join(""):""}<div class="t"><h1>Brendan Media</h1><p>Photography</p><a class="btn pri" href="#gallery">View Gallery</a> <a class="btn sec" href="#book" data-book style="background:#ffffff33;color:#fff">Book Me</a></div>${s.length>1?`<div class="dots">${s.map((_,i)=>`<i class="${i?"":"on"}" data-i="${i}"></i>`).join("")}</div>`:""}</section>`;

 app.innerHTML=`<div class="wrap"><h2>Gallery</h2><p class="sub">Select a collection.</p>${gals.length?`<div class="grid">${gals.map(g=>`<button class="card" data-g="${g.id}">${g.photos?.length?`<img src="${g.photos[0].th}" alt="" loading="lazy">`:""}<div class="nm">${esc(g.name)}<span>${g.photos?.length||0} photos</span></div></button>`).join("")}</div>`:`<div class="empty">${ready?(lerr||"No galleries yet."):"Loading…"}</div>`}</div>`;

 app.innerHTML=`<div class="wrap"><button class="back" onclick="location.hash='gallery'">‹ Gallery</button><h2>${esc(g.name)}</h2><p class="sub">${P.length} photos</p><div class="rows" id="rows"></div></div>`;
 const rows=$("#rows"),W=Math.min(innerWidth,1200)-(innerWidth<600?24:40),target=innerWidth<600?2.2:3.6;let r=[],sum=0;
 const flush=last=>{if(!r.length)return;const d=document.createElement("div");d.className="row";
